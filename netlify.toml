# Deux sites Netlify, un seul dépôt GitHub.
#
# 1) Site APP (duplicata web de l'app)
#    Import GitHub → ce repo. Rien à changer (SITE_TARGET=app par défaut).
#
# 2) Site ADMIN (panneau d'administration)
#    Import GitHub → le MÊME repo.
#    Site configuration → Environment variables :
#      SITE_TARGET = admin

[build]
  command = "bash tool/netlify_build.sh"
  publish = "build/web_deploy"

[build.environment]
  SITE_TARGET = "app"
  FLUTTER_GIT_URL = "https://github.com/flutter/flutter.git"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
