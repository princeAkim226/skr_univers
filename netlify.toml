# Deux sites Netlify, un seul dépôt GitHub.
# SITE_TARGET n'est PAS défini ici : sinon Netlify ignore la variable
# du tableau de bord et reconstruit toujours l'app.
#
# Site APP   : aucun réglage (défaut = app)
# Site ADMIN : Environment variables → SITE_TARGET = admin
#              puis Deploys → Trigger deploy → Deploy site

[build]
  command = "bash tool/netlify_build.sh"
  publish = "build/web_deploy"

[build.environment]
  FLUTTER_GIT_URL = "https://github.com/flutter/flutter.git"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
